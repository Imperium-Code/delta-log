<!DOCTYPE html>
<html>
<head>
    <title>Diet Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Diet Tracker</h1>
    <p>Track your weight and nutrition</p>

    <h2>Log Weight</h2>
    <input id="weightInput" type="number" step="0.1" placeholder="Enter Weight">

    <button id="saveButton">Save Weight</button>

    <h2>Weight History</h2>
    <div id="weeklyHistory"></div>

    <h2>Daily Nutrition Goals</h2>
    <input id="calorieGoalInput" type="number" placeholder="Daily Calorie Goal">
    <input id="proteinGoalInput" type="number" placeholder="Daily Protein Goal (g)">
    <button id="saveGoalsButton">Save Goals</button>

    <h3>Daily Progress</h3>
    <p id="calorieProgressText">Calories: 0%</p>
    <progress id="calorieProgressBar" value="0" max="100"></progress>
    <p id="remainingCalories">Calories Remaining: --</p>
    <p id="proteinProgressText">Protein: 0%</p>
    <progress id="proteinProgressBar" value="0" max="100"></progress>
    <p id="remainingProtein">Protein Remaining: --</p>

    <h2>Log Food</h2>
    <input id="calorieInput" type="number" placeholder="Calories">
    <input id="proteinInput" type="number" placeholder="Protein (g)">

    <button id="foodSaveButton">Add Food</button>

    <h2>Today's Macros</h2>
    <p id="dailyCalories">Calories: 0</p>
    <p id="dailyProtein">Protein: 0 g</p>

    <div id="foodHistory"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
