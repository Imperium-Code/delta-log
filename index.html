<!DOCTYPE html>
<html>
<head>
    <title>Diet Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Diet Tracker</h1>
    <p>Track your weight and nutrition</p>

    <h2>Log Weight</h2>
    <input id="weightInput" type="number" step="0.1" placeholder="Enter Weight">

    <button id="saveButton">Save Weight</button>

    <h2>Weight History</h2>
    <div id="weeklyHistory"></div>

    <script src="script.js"></script>
</body>
</html>
